[package]
name = "proc-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.wasm32-unknown-unknown.dependencies.getrandom]
version = "0.3.3"
features = ["wasm_js"]

[features]
default = ["console_error_panic_hook"]
# main = ["dep:tokio/rt-multi-thread", "dep:tokio/rt", "dep:tokio/macros"]
# main = ["dep:tokio"]

[dependencies]
# enum-id = {path = "enum_id"}
# enum-id-derive = {path = "enum_id_derive"}
proc-core = {path = "proc-core"}

serde-wasm-bindgen = "0.6.5"
serde_derive = "1.0.219"
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"] }

serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
wasm-bindgen-futures = "0.4.50"
regex = "1.11.1"
# clap = { version = "4.5.41", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
nalgebra = "0.34.0"
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
# tokio = { version = "1.49.0", optional = true, features = ["rt", "macros", "rt-multi-thread"]}
rmp-serde = "1.3.1"
base64 = "0.22.1"
syn = { version = "2.0.117" }

[dependencies.web-sys]
version = "0.3.77"
features = ['console', 'Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window', 'ReadableStream']

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
approx = "0.5.1"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
