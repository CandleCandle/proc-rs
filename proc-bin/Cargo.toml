[package]
name = "proc-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
proc-core = {path = "../proc-core"}

base64 = "0.23"
clap = { version = "4.5.41", features = ["derive"] }
rmp-serde = "1.3.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tabled = "0.21"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt", "macros", "rt-multi-thread"]}
